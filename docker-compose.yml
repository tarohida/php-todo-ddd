x-app-environment: &app-environment
  DB_NAME: &db-name ${DB_NAME:?DB_NAME is required; run scripts/check-env.sh}
  TEST_DB_NAME: &test-db-name ${TEST_DB_NAME:-todo_test}
  DB_USER: &db-user ${DB_USER:?DB_USER is required; run scripts/check-env.sh}
  DB_PASSWORD: &db-password ${DB_PASSWORD:?DB_PASSWORD is required; run scripts/check-env.sh}
  DB_HOST: &db-host ${DB_HOST:?DB_HOST is required; run scripts/check-env.sh}
  ALLOW_ORIGIN_URL: ${ALLOW_ORIGIN_URL:?ALLOW_ORIGIN_URL is required; run scripts/check-env.sh}

services:
  web:
    image: nginx:1.28.3-alpine
    volumes:
      - ./.docker/conf/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8081}:80"
    depends_on:
      - php

  php:
    build: .docker
    environment:
      <<: *app-environment
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: client_host=${XDEBUG_CLIENT_HOST:-host.docker.internal} client_port=${XDEBUG_CLIENT_PORT:-9003}
    volumes:
      - ./.docker/conf/php/php.ini:/usr/local/etc/php/conf.d/php.ini:ro
      - ./.docker/conf/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  composer:
    image: composer:2.10.2
    profiles: [tools]
    volumes:
      - .:/app

  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: *db-name
      TEST_DB_NAME: *test-db-name
      POSTGRES_USER: *db-user
      POSTGRES_PASSWORD: *db-password
    healthcheck:
      test: [CMD-SHELL, "psql -U ${DB_USER} -d ${DB_NAME} -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data_v18:/var/lib/postgresql
      - ./.docker/conf/postgres/:/docker-entrypoint-initdb.d/:ro

volumes:
  postgres_data_v18:
    name: ${POSTGRES_VOLUME_NAME:-php-todo-ddd-postgres-data-v18}
