services:
  legacy-db:
    image: postgres:10.23-bullseye
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - legacy_postgres_data:/var/lib/postgresql/data

  dump:
    image: postgres:18.6
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    depends_on:
      legacy-db:
        condition: service_healthy
    command:
      - pg_dump
      - --host=legacy-db
      - --username=${DB_USER}
      - --dbname=${DB_NAME}
      - --format=custom
      - --file=/backup/postgres-10.dump
    volumes:
      - ./var/backups:/backup

volumes:
  legacy_postgres_data:
    external: true
    name: ${LEGACY_POSTGRES_VOLUME:?Set LEGACY_POSTGRES_VOLUME to an existing PostgreSQL 10 volume}
