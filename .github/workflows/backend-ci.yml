name: Backend CI

on:
  pull_request:
    branches:
      - work/20260826-todo-web-api
  push:
    branches:
      - work/20260826-todo-web-api

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Composer and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPOSER_NO_INTERACTION: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.5 and Composer 2.10.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_pgsql
          tools: composer:2.10.2
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Validate Composer metadata and lock file
        run: composer validate --strict --no-interaction

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Lint PHP files
        run: |
          php -l phinx.php
          find db public scripts src tests -type f -name '*.php' -print0 \
            | sort -z \
            | xargs -0 -n 1 php -l

      - name: Run unit tests
        run: composer test:unit

      - name: Run environment and migration guard tests
        run: |
          tests/scripts/check-env-test.sh
          tests/scripts/test-integration-cleanup-test.sh
          tests/scripts/migrate-postgres-guard-test.sh

  integration:
    name: Isolated integration and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      INTEGRATION_RUN_ID: ${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare non-secret CI environment defaults
        run: cp .env.example .env

      - name: Build the image and run isolated integration checks
        run: scripts/test-integration.sh

      - name: Remove isolated Compose resources
        if: always()
        run: scripts/test-integration.sh --cleanup-only
